<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Spoken.ai — Browser Verification Suite</title>
  <style>
    body { font-family: monospace; background: #060a14; color: #f8fafc; padding: 2.5rem; line-height: 1.6; }
    h1 { color: #00f0ff; font-size: 1.4rem; margin-bottom: 0.5rem; }
    .subtitle { color: #94a3b8; font-size: 0.85rem; margin-bottom: 2rem; }
    .test-pass { color: #10b981; margin: 0.35rem 0; font-size: 0.85rem; }
    .test-fail { color: #f43f5e; font-weight: bold; margin: 0.35rem 0; font-size: 0.85rem; }
    .summary { margin-top: 2rem; padding: 1.2rem; border: 1px solid rgba(255,255,255,0.1); border-radius: 8px; background: rgba(255,255,255,0.02); }
  </style>
</head>
<body>
  <h1>Spoken.ai Verification Suite</h1>
  <div class="subtitle">Validating Meaning Preservation · Grammar Rules · False Positive Prevention · Storage Safety</div>
  <div id="results">Running test suite…</div>
  <div class="summary" id="summary"></div>

  <script type="module">
    import { AnalysisEngine } from '../js/analysis.js';
    import { StorageManager } from '../js/storage.js';

    const results = document.getElementById('results');
    const summary = document.getElementById('summary');
    results.innerHTML = '';

    let passed = 0;
    let failed = 0;

    function assert(condition, message, details = '') {
      const p = document.createElement('div');
      if (condition) {
        p.className = 'test-pass';
        p.textContent = `✔ PASS: ${message}`;
        passed++;
      } else {
        p.className = 'test-fail';
        p.textContent = `✖ FAIL: ${message} (${details})`;
        failed++;
      }
      results.appendChild(p);
    }

    const engine = new AnalysisEngine();

    // 1. Meaning preservation
    const r1 = engine.analyzeSession('I made a project which help students to learn programming and it have many features.', 30, null);
    assert(!r1.suggestedImprovement.includes('master') && r1.suggestedImprovement.includes('learn programming'), 'Preserves user meaning without inflating claims ("learn programming" retained)');

    // 2. Grammar error detection
    const r2 = engine.analyzeSession('it have many features and we was trying to fix it', 30, null);
    assert(r2.hasGrammarIssues === true && r2.suggestedImprovement.includes('it has') && r2.suggestedImprovement.includes('we were'), 'Corrects multiple true grammar errors ("it has", "we were")');

    // 3. Stative verb agree
    const r3 = engine.analyzeSession('I am agree with this choice', 10, null);
    assert(r3.suggestedImprovement.includes('I agree'), 'Fixes stative verb ("I am agree" -> "I agree")');

    // 4. False Positive Guard
    const r4 = engine.analyzeSession('I enjoy collaborating with software teams to build helpful applications.', 15, null);
    assert(r4.hasGrammarIssues === false, 'False Positive Guard: Valid English is not falsely flagged as an error');

    // 5. Distinction between error and style
    const r5 = engine.analyzeSession('I did this according to me', 10, null);
    assert(r5.explanations.some(e => e.type === 'style') && !r5.explanations.some(e => e.type === 'error'), 'Distinguishes optional style suggestions from strict grammar errors');

    // 6. Vocabulary Complexity (Experimental)
    const r6 = engine.analyzeSession('good very good yes good okay', 10, null);
    assert(r6.vocabComplexityRating.includes('Foundational'), 'Rates repetitive vocabulary as Foundational (Experimental indicator)');

    // 7. Speech deduplication simulation
    const testSegments = [];
    ['hello', 'hello', 'world', 'world'].forEach(word => {
      const last = testSegments[testSegments.length - 1];
      if (!last || last !== word) testSegments.push(word);
    });
    assert(testSegments.join(' ') === 'hello world', 'Simulated speech recovery prevents duplicate word additions');

    // 8. Storage persistence safety
    StorageManager.saveSession({ date: new Date().toISOString(), prompt: 'Test', score: 90, wpm: 130, fillers: 0 });
    const sessions = StorageManager.getSessions();
    assert(sessions.length > 0 && typeof StorageManager.getStreak() === 'number', 'Storage correctly persists session metadata and updates streak');

    summary.innerHTML = `<strong>Total Tests: ${passed + failed} | Passed: ${passed} | Failed: ${failed}</strong>`;
  </script>
</body>
</html>
